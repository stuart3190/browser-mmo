name: CI

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mmo
          POSTGRES_PASSWORD: mmo
          POSTGRES_DB: mmo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mmo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://mmo:mmo@localhost:5432/mmo_ci_unused
      TEST_DATABASE_URL: postgres://mmo:mmo@localhost:5432/mmo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Install matching PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
      - run: pnpm exec tsx scripts/backup-restore-test.ts
      - run: pnpm assets:check
      - run: pnpm build
        env:
          NODE_ENV: production
