<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMO Admin</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f5f5f7;
        color: #222;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      section {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        margin: 12px 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      td,
      th {
        text-align: left;
        border-bottom: 1px solid #eee;
        padding: 4px 6px;
      }
      button.link {
        background: none;
        border: none;
        color: #2563eb;
        cursor: pointer;
        padding: 0;
      }
      .error {
        color: #b91c1c;
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
